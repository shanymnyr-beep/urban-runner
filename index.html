<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Urban Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:oklch(80% 0.16 85);--gold-deep:oklch(64% 0.16 70);--green:oklch(72% 0.19 145);--green-deep:oklch(58% 0.18 148);--blue:oklch(70% 0.15 240);--blue-deep:oklch(56% 0.16 250);--purple:oklch(60% 0.17 300);--purple-deep:oklch(48% 0.17 302);--orange:oklch(72% 0.18 55);--orange-deep:oklch(60% 0.18 48);--cyan:oklch(78% 0.13 210);--heart:oklch(62% 0.21 22);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;overflow:hidden;background:oklch(16% 0.03 275);font-family:'Fredoka',system-ui,sans-serif;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:520px;max-height:960px;background:oklch(20% 0.03 275);overflow:hidden;box-shadow:0 0 60px oklch(0% 0 0 /.5);}
  @media(min-width:540px){#stage{border-radius:24px;}}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;z-index:5;}
  .hidden{display:none !important;}
  .topbar{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;gap:10px;padding:14px 14px 0;justify-content:space-between;pointer-events:none;}
  .pill{display:flex;align-items:center;gap:7px;background:oklch(38% 0.09 285 /.82);border:2px solid oklch(78% 0.10 250 /.55);padding:5px 14px 5px 7px;border-radius:999px;color:#fff;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 oklch(24% 0.06 285 /.5),inset 0 1px 0 oklch(90% 0.05 250 /.3);}
  .pill .ic{width:26px;height:26px;flex:none;}
  .num{text-shadow:0 2px 0 oklch(20% 0.05 285 /.6);}
  #menu{align-items:center;justify-content:flex-end;padding:0 0 46px;}
  .logo{position:absolute;top:14%;left:0;right:0;text-align:center;pointer-events:none;}
  .logo h1{font-size:clamp(46px,15vw,74px);line-height:.82;font-weight:700;font-style:italic;transform:rotate(-3deg);}
  .logo .u{color:oklch(74% 0.14 235);-webkit-text-stroke:6px oklch(30% 0.06 275);paint-order:stroke fill;}
  .logo .r{color:oklch(66% 0.19 35);-webkit-text-stroke:6px oklch(30% 0.06 275);paint-order:stroke fill;text-shadow:0 6px 0 oklch(46% 0.15 35);}
  .playbtn{position:relative;width:150px;height:150px;border:none;cursor:pointer;background:radial-gradient(circle at 38% 32%,oklch(86% 0.13 55),oklch(70% 0.20 30) 70%);border-radius:42% 42% 46% 46%/44%;box-shadow:0 10px 0 oklch(52% 0.19 28),0 16px 26px oklch(20% 0.1 30 /.5),inset 0 4px 0 oklch(94% 0.08 70 /.7);display:flex;align-items:center;justify-content:center;margin-bottom:34px;transition:transform .12s cubic-bezier(.16,1,.3,1);animation:breathe 2.4s ease-in-out infinite;}
  @keyframes breathe{50%{transform:scale(1.05);}}
  .playbtn:active{transform:scale(.94);}
  .playbtn svg{margin-left:12px;filter:drop-shadow(0 3px 0 oklch(40% 0.14 30));}
  .playbtn .lbl{position:absolute;bottom:26px;font-size:26px;font-weight:700;color:#fff;text-shadow:0 2px 0 oklch(48% 0.16 30);letter-spacing:.02em;}
  .menu-btn{display:flex;align-items:center;gap:14px;width:270px;margin:7px 0;padding:13px 20px;border:2.5px solid oklch(86% 0.09 250 /.7);border-radius:18px;cursor:pointer;color:#fff;text-align:left;background:linear-gradient(oklch(50% 0.12 288),oklch(42% 0.12 290));box-shadow:0 5px 0 oklch(30% 0.09 290),inset 0 1px 0 oklch(88% 0.06 250 /.35);transition:transform .1s ease-out;}
  .menu-btn:active{transform:translateY(3px);box-shadow:0 2px 0 oklch(30% 0.09 290);}
  .menu-btn .mtitle{font-size:22px;font-weight:700;line-height:1;}
  .menu-btn .msub{font-size:13px;font-weight:500;opacity:.8;}
  .menu-btn .mico{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;}
  .sheet{position:absolute;inset:0;z-index:9;background:oklch(30% 0.07 285 /.55);backdrop-filter:blur(3px);display:flex;flex-direction:column;padding:64px 16px 16px;}
  .sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .sheet-head h2{color:#fff;font-size:30px;font-weight:700;font-style:italic;text-shadow:0 3px 0 oklch(40% 0.12 285);flex:1;text-align:center;}
  .backbtn{width:46px;height:46px;border:none;border-radius:14px;cursor:pointer;flex:none;background:linear-gradient(oklch(64% 0.15 250),oklch(52% 0.16 258));box-shadow:0 4px 0 oklch(40% 0.13 260);display:flex;align-items:center;justify-content:center;color:#fff;}
  .backbtn:active{transform:translateY(3px);box-shadow:0 1px 0 oklch(40% 0.13 260);}
  .grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 2px 8px;}
  .char{position:relative;border-radius:18px;padding:10px 8px 12px;color:#fff;overflow:hidden;background:linear-gradient(oklch(52% 0.10 285),oklch(42% 0.11 288));border:2.5px solid oklch(80% 0.08 250 /.5);box-shadow:0 4px 0 oklch(28% 0.08 288);}
  .char.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 4px 0 oklch(28% 0.08 288);}
  .char.locked{filter:saturate(.5) brightness(.8);}
  .char canvas{width:100%;height:96px;border-radius:12px;background:linear-gradient(oklch(70% 0.1 235),oklch(80% 0.08 210));margin-bottom:7px;}
  .char .cname{font-size:15px;font-weight:700;text-align:center;line-height:1.05;min-height:32px;display:flex;align-items:center;justify-content:center;}
  .price{display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:15px;margin:2px 0 8px;}
  .price .ic{width:19px;height:19px;}
  .cbtn{width:100%;border:none;border-radius:12px;padding:8px;font-family:inherit;font-weight:700;font-size:15px;color:#fff;cursor:pointer;letter-spacing:.02em;}
  .cbtn.buy{background:linear-gradient(var(--green),var(--green-deep));box-shadow:0 3px 0 oklch(46% 0.16 148);}
  .cbtn.sel{background:linear-gradient(var(--blue),var(--blue-deep));box-shadow:0 3px 0 oklch(44% 0.14 255);}
  .cbtn.need{background:oklch(42% 0.03 285);box-shadow:0 3px 0 oklch(30% 0.02 285);color:oklch(78% 0.02 285);}
  .cbtn:active{transform:translateY(2px);}
  .lockbadge{position:absolute;top:14px;right:14px;width:30px;height:30px;}
  .skill-row{display:flex;align-items:center;gap:14px;background:oklch(48% 0.09 286 /.9);border:2px solid oklch(82% 0.07 250 /.4);border-radius:16px;padding:12px 14px;margin-bottom:11px;color:#fff;}
  .skill-row .sk-ic{width:52px;height:52px;flex:none;}
  .skill-row .sk-body{flex:1;}
  .skill-row .sk-name{font-size:18px;font-weight:700;}
  .skill-row .sk-desc{font-size:12.5px;opacity:.82;font-weight:500;}
  .dots{display:flex;gap:4px;margin-top:5px;}
  .dot{width:16px;height:8px;border-radius:4px;background:oklch(72% 0 0 /.28);}
  .dot.on{background:var(--gold);}
  .upg{border:none;border-radius:12px;padding:9px 12px;font-family:inherit;font-weight:700;font-size:13px;color:#fff;cursor:pointer;min-width:82px;background:linear-gradient(var(--gold),var(--gold-deep));box-shadow:0 3px 0 oklch(50% 0.15 65);}
  .upg:active{transform:translateY(2px);}
  .upg.max{background:oklch(42% 0.03 285);box-shadow:0 3px 0 oklch(30% 0.02 285);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;background:oklch(48% 0.09 286 /.9);border:2px solid oklch(82% 0.07 250 /.4);border-radius:16px;padding:16px 18px;margin-bottom:12px;color:#fff;font-size:19px;font-weight:600;}
  .sw{width:60px;height:32px;border-radius:999px;border:none;cursor:pointer;position:relative;background:oklch(40% 0.02 285);transition:background .2s;}
  .sw.on{background:var(--green);}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.16,1,.3,1);box-shadow:0 1px 3px oklch(0% 0 0 /.4);}
  .sw.on::after{transform:translateX(28px);}
  .settings-foot{margin-top:auto;color:oklch(86% 0.03 250);font-size:12px;text-align:center;font-weight:500;opacity:.7;}
  #hearts{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:8;}
  #hearts svg{width:32px;height:32px;filter:drop-shadow(0 2px 2px oklch(0% 0 0 /.35));}
  #hearts svg.lost{opacity:.22;filter:grayscale(1);}
  #scorebox{position:absolute;top:58px;right:14px;text-align:right;z-index:8;color:#fff;pointer-events:none;}
  #scorebox .s-lbl{font-size:12px;font-weight:600;opacity:.85;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 2px oklch(20% 0.05 275);}
  #scorebox .s-val{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 3px 0 oklch(30% 0.06 275 /.8);}
  #distbox{font-size:14px;opacity:.9;margin-top:3px;font-weight:600;font-variant-numeric:tabular-nums;}
  #pausebtn{position:absolute;top:14px;left:14px;z-index:9;width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;background:oklch(40% 0.07 65 /.9);box-shadow:0 3px 0 oklch(52% 0.16 60);display:flex;align-items:center;justify-content:center;color:#fff;}
  #pausebtn:active{transform:translateY(2px);}
  #boostbar{position:absolute;top:112px;left:14px;z-index:8;display:flex;flex-direction:column;gap:8px;}
  .pw{width:42px;height:42px;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center;background:oklch(38% 0.07 285 /.85);border:2px solid oklch(80% 0.1 250 /.4);overflow:hidden;}
  .pw svg{width:24px;height:24px;z-index:2;}
  .pw .fill{position:absolute;left:0;bottom:0;width:100%;z-index:1;opacity:.42;}
  #dpad{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:8;width:210px;height:210px;pointer-events:none;}
  .dbtn{position:absolute;width:66px;height:66px;border:none;border-radius:18px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .08s;}
  .dbtn:active{transform:scale(.88);}
  .dbtn svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px oklch(0% 0 0 /.4));}
  #d-up{top:0;left:72px;background:radial-gradient(circle at 40% 35%,var(--cyan),oklch(60% 0.13 215));box-shadow:0 0 18px oklch(78% 0.13 210 /.7),0 4px 0 oklch(50% 0.12 218);}
  #d-down{bottom:0;left:72px;background:radial-gradient(circle at 40% 35%,var(--orange),var(--orange-deep));box-shadow:0 0 18px oklch(72% 0.18 55 /.7),0 4px 0 oklch(52% 0.16 48);}
  #d-left{left:0;top:72px;background:radial-gradient(circle at 40% 35%,var(--purple),var(--purple-deep));box-shadow:0 0 18px oklch(60% 0.17 300 /.7),0 4px 0 oklch(42% 0.16 302);}
  #d-right{right:0;top:72px;background:radial-gradient(circle at 40% 35%,var(--green),var(--green-deep));box-shadow:0 0 18px oklch(72% 0.19 145 /.7),0 4px 0 oklch(48% 0.16 148);}
  #dpad .hub{position:absolute;top:80px;left:80px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 35%,oklch(86% 0.13 85),oklch(70% 0.16 70));box-shadow:0 0 12px oklch(80% 0.14 80 /.6);display:flex;align-items:center;justify-content:center;}
  #dpad .hub svg{width:30px;height:30px;}
  #countdown{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  #countdown span{font-size:120px;font-weight:700;color:#fff;font-style:italic;text-shadow:0 6px 0 oklch(40% 0.12 285),0 0 30px oklch(80% 0.12 250);}
  #toast{position:absolute;top:40%;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;font-size:26px;font-weight:700;font-style:italic;color:#fff;opacity:0;white-space:nowrap;text-shadow:0 3px 0 oklch(38% 0.14 285),0 0 16px oklch(82% 0.14 90);}
  #gameover,#pause{align-items:center;justify-content:center;z-index:11;background:oklch(24% 0.05 285 /.6);backdrop-filter:blur(4px);}
  .go-card{width:min(88%,340px);border-radius:26px;padding:0 20px 24px;color:#fff;position:relative;background:linear-gradient(oklch(56% 0.11 288),oklch(46% 0.12 290));border:3px solid oklch(82% 0.10 250 /.6);box-shadow:0 12px 0 oklch(30% 0.09 290),0 20px 40px oklch(15% 0.06 285 /.6);}
  .go-title{text-align:center;font-size:40px;font-weight:700;font-style:italic;margin:-26px 0 14px;color:oklch(92% 0.08 240);text-shadow:0 4px 0 oklch(40% 0.14 285),0 0 20px oklch(80% 0.12 250);}
  .res{background:oklch(42% 0.10 290 /.7);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .res .r-l{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.03em;}
  .res .r-l svg{width:30px;height:30px;}
  .res .r-v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;}
  .res.best .r-v{color:var(--green);}
  .go-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .go-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:none;border-radius:16px;padding:14px;font-family:inherit;font-weight:700;font-size:22px;color:#fff;cursor:pointer;letter-spacing:.02em;}
  .go-btn svg{width:26px;height:26px;}
  .go-btn.retry{background:linear-gradient(var(--green),var(--green-deep));box-shadow:0 5px 0 oklch(46% 0.16 148);}
  .go-btn.home{background:linear-gradient(var(--blue),var(--blue-deep));box-shadow:0 5px 0 oklch(44% 0.14 255);}
  .go-btn:active{transform:translateY(3px);}
  .newbest{position:absolute;top:14px;right:-6px;background:var(--gold);color:oklch(30% 0.1 70);font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;transform:rotate(8deg);box-shadow:0 3px 0 oklch(58% 0.14 65);letter-spacing:.05em;}
  .pause-card{text-align:center;color:#fff;}
  .pause-card h2{font-size:44px;font-style:italic;font-weight:700;margin-bottom:24px;text-shadow:0 4px 0 oklch(40% 0.12 285);}
  .hint{position:absolute;bottom:240px;left:50%;transform:translateX(-50%);z-index:8;color:#fff;font-size:14px;font-weight:600;text-align:center;opacity:.95;text-shadow:0 2px 3px oklch(20% 0.05 275);background:oklch(30% 0.06 285 /.55);padding:8px 16px;border-radius:999px;transition:opacity .5s;pointer-events:none;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="menu" class="screen">
    <div class="topbar">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#e9a324"/><circle cx="12" cy="12" r="7.5" fill="#f7c948"/><path d="M6 15l1.5-5 2.5 2.5L12 9l2.5 3.5L17 10l1.5 5z" fill="#c98a1f"/></svg><span class="num" id="m-coins">0</span></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9l3-4h10l3 4-8 11z" fill="#e0453a" stroke="#a12a20" stroke-width="1"/></svg><span class="num" id="m-gems">0</span></div>
    </div>
    <div class="logo"><h1><span class="u">URBAN</span><br><span class="r">RUNNER</span></h1></div>
    <button class="playbtn" id="btn-play"><svg width="66" height="66" viewBox="0 0 24 24"><path d="M6 3l16 9-16 9z" fill="#fff"/></svg><span class="lbl">PLAY</span></button>
    <button class="menu-btn" id="btn-shop"><span class="mico"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M4 8l1-3h14l1 3v2a2 2 0 01-4 0 2 2 0 01-4 0 2 2 0 01-4 0 2 2 0 01-4 0z" fill="#f7c948" stroke="#b6791a" stroke-width="1"/><rect x="5" y="11" width="14" height="8" rx="1" fill="#e05a4a" stroke="#a13529" stroke-width="1"/></svg></span><span><span class="mtitle">Shop</span><br><span class="msub">Characters</span></span></button>
    <button class="menu-btn" id="btn-skills"><span class="mico"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="#ffd23f" stroke="#c98a1f" stroke-width="1"/></svg></span><span><span class="mtitle">Skills</span><br><span class="msub">Upgrades</span></span></button>
    <button class="menu-btn" id="btn-settings"><span class="mico"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4l-2-1.5.3-2.5-2.4-.8-1.2-2.2L13 4l-1-1-1 1-2.7-.8-1.2 2.2-2.4.8.3 2.5L3 12l2 1.5-.3 2.5 2.4.8 1.2 2.2L11 20l1 1 1-1 2.7.8 1.2-2.2 2.4-.8-.3-2.5z" fill="#c9cdd6" stroke="#8b8f99" stroke-width="1"/></svg></span><span><span class="mtitle">Settings</span><br><span class="msub">Sound & more</span></span></button>
  </div>
  <div id="shop" class="sheet hidden">
    <div class="sheet-head"><button class="backbtn" data-close><svg width="22" height="22" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Character Shop</h2><div style="width:46px"></div></div>
    <div style="display:flex;justify-content:center;gap:14px;margin-bottom:12px">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#e9a324"/><circle cx="12" cy="12" r="7.5" fill="#f7c948"/></svg><span class="num" id="s-coins">0</span></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9l3-4h10l3 4-8 11z" fill="#e0453a"/></svg><span class="num" id="s-gems">0</span></div>
    </div>
    <div class="grid" id="charGrid"></div>
  </div>
  <div id="skills" class="sheet hidden">
    <div class="sheet-head"><button class="backbtn" data-close><svg width="22" height="22" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Skills</h2><div style="width:46px"></div></div>
    <div id="skillList" style="flex:1;overflow-y:auto"></div>
  </div>
  <div id="settings" class="sheet hidden">
    <div class="sheet-head"><button class="backbtn" data-close><svg width="22" height="22" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Settings</h2><div style="width:46px"></div></div>
    <div class="toggle-row">Sound <button class="sw on" id="sw-sound"></button></div>
    <div class="toggle-row">Music <button class="sw on" id="sw-music"></button></div>
    <div class="toggle-row">Vibration <button class="sw" id="sw-vibe"></button></div>
    <div class="toggle-row" style="cursor:pointer" id="reset-row">Reset progress <span style="font-size:14px;opacity:.7">tap to wipe</span></div>
    <div class="settings-foot">Urban Runner v2.0 · arrows / swipe: jump, slide, switch lanes</div>
  </div>
  <div id="game" class="screen hidden" style="pointer-events:none">
    <button id="pausebtn" style="pointer-events:auto"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="#fff"/><rect x="14" y="4" width="4" height="16" rx="1" fill="#fff"/></svg></button>
    <div class="topbar" style="justify-content:flex-start;padding-left:70px">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#e9a324"/><circle cx="12" cy="12" r="7.5" fill="#f7c948"/></svg><span class="num" id="g-coins">0</span></div>
    </div>
    <div id="hearts"></div>
    <div id="scorebox"><div class="s-lbl">Score</div><div class="s-val" id="g-score">0</div><div id="distbox">0 m</div></div>
    <div id="boostbar"></div>
    <div class="hint" id="hint">Swipe &larr; &rarr; to switch lanes &middot; &uarr; jump &middot; &darr; slide</div>
    <div id="dpad">
      <button class="dbtn" id="d-up"><svg viewBox="0 0 24 24"><path d="M12 4l8 9h-5v7H9v-7H4z" fill="#fff"/></svg></button>
      <button class="dbtn" id="d-down"><svg viewBox="0 0 24 24"><path d="M12 20l-8-9h5V4h6v7h5z" fill="#fff"/></svg></button>
      <button class="dbtn" id="d-left"><svg viewBox="0 0 24 24"><path d="M4 12l9-8v5h7v6h-7v5z" fill="#fff"/></svg></button>
      <button class="dbtn" id="d-right"><svg viewBox="0 0 24 24"><path d="M20 12l-9-8v5H4v6h7v5z" fill="#fff"/></svg></button>
      <div class="hub"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e9a324"/><circle cx="12" cy="12" r="6.5" fill="#f7c948"/><path d="M8 14l1-3.5 1.5 1.5 1.5-2.5 1.5 2.5L15 10.5 16 14z" fill="#c98a1f"/></svg></div>
    </div>
  </div>
  <div id="countdown" class="hidden"><span>3</span></div>
  <div id="toast"></div>
  <div id="pause" class="screen hidden">
    <div class="pause-card"><h2>Paused</h2>
      <button class="go-btn retry" id="resume" style="width:220px;margin-bottom:12px"><svg viewBox="0 0 24 24"><path d="M6 3l16 9-16 9z" fill="#fff"/></svg>Resume</button>
      <button class="go-btn home" id="pause-home" style="width:220px"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" fill="#fff"/></svg>Home</button>
    </div>
  </div>
  <div id="gameover" class="screen hidden">
    <div class="go-card">
      <div class="newbest hidden" id="newbest">NEW BEST!</div>
      <div class="go-title">GAME OVER!</div>
      <div class="res"><div class="r-l"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 4 1 5.5L12 16l-5 2.3 1-5.5-4-4 5.5-.8z" fill="#ffd23f" stroke="#c98a1f" stroke-width="1"/></svg>FINAL SCORE</div><div class="r-v" id="go-score">0</div></div>
      <div class="res"><div class="r-l"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e9a324"/><circle cx="12" cy="12" r="6.5" fill="#f7c948"/></svg>COINS</div><div class="r-v" id="go-coins">0</div></div>
      <div class="res best"><div class="r-l"><svg viewBox="0 0 24 24"><path d="M6 4h12v3a4 4 0 01-4 4h-4a4 4 0 01-4-4z" fill="#ffd23f" stroke="#c98a1f" stroke-width="1"/><rect x="10" y="11" width="4" height="5" fill="#e9a324"/><rect x="7" y="16" width="10" height="3" rx="1" fill="#e9a324"/></svg>BEST SCORE</div><div class="r-v" id="go-best">0</div></div>
      <div class="go-btns">
        <button class="go-btn retry" id="retry"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 11-5 5H4a8 8 0 108-8z" fill="#fff"/></svg>RETRY</button>
        <button class="go-btn home" id="go-home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" fill="#fff"/></svg>HOME</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
